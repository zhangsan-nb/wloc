name: Verify self-hosted build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check self-hosted references
        run: node scripts/check-self-hosted.mjs

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Test Worker routes
        run: npm test --prefix worker

      - name: Build Worker bundle
        run: npm run build --prefix worker
